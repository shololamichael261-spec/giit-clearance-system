<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Certificate — GIIT Clearance System</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo-wrap"><img src="giit-africa-logo.svg" alt="GIIT Africa" class="brand-logo" /></div>
      <div>
        <h1>Certificate Verification</h1>
        <p>GIIT Clearance System</p>
      </div>
    </div>
  </header>

  <main class="verify-main">
    <section class="verify-card" id="verifyCard">
      <span class="eyebrow">Checking Certificate</span>
      <h2>Verifying...</h2>
      <p>Please wait while we confirm this certificate from the GIIT clearance database.</p>
    </section>
  </main>

  <script src="firebase-config.js"></script>
  <script type="module" src="verify.js"></script>
</body>
</html>
